name: Release desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + PyInstaller
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Freeze backend with PyInstaller
        working-directory: desktop
        run: pyinstaller knowledge-view-backend.spec

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        env:
          KV_BUILD_TARGET: desktop
        run: |
          npm ci
          npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Package + publish installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
