<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Knowledge View</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.22), transparent 65%);
  }
  img { width: 64px; height: 64px; border-radius: 16px; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  .brand span { color: #38bdf8; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #94a3b8; margin-top: 4px; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(148, 163, 184, 0.3);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .note { font-size: 11px; color: #64748b; min-height: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <img src="assets/icon.png" alt="">
    <div class="brand">Knowledge<span> View.</span></div>
    <div class="status"><div class="spinner"></div><span id="label">起動中...</span></div>
    <div class="note" id="note"></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('mode') === 'stopping') {
      document.getElementById('label').textContent = '停止中...';
      document.getElementById('note').textContent = 'データを安全に保存して終了しています';
    }
  </script>
</body>
</html>
